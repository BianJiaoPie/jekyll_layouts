---
layout: base
---

<script type="module" src="https://bianjiaopie.com/wc/doc_ui.es.js"></script>

<sidebar-component>
    <table-of-contents></table-of-contents>
</sidebar-component>

<h1>{{ page.title }}</h1>

{%- if page.image %}
<img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" class="post-cover" width="{{ page.image_width | default: 825 }}" height="{{ page.image_height | default: 1275 }}" style="width:100%;max-width:800px;height:auto;border-radius:8px;display:block;margin:0 auto 1.5em;" loading="eager" fetchpriority="high">
{%- endif %}

<heading-id-injector>
{{ content }}
</heading-id-injector>

<script>
    var parentDirectory = "/Blog/"; // This variable can be used in other scripts
</script>
  
<script src="https://posetmage.com/cdn/js/OtherBlogPosts.js"></script>
